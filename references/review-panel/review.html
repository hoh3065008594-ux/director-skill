<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÉLYSÉE · 审片</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0A08;color:#E8E4DC;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;padding:20px 18px 60px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;max-width:1240px;margin:0 auto 6px}
.brand{font-family:Georgia,serif;font-size:15px;letter-spacing:.5em;color:#B99A6B}
.sub{font-size:11px;letter-spacing:.3em;color:#6F6A60;font-weight:300}
.status{font-size:12px;color:#8A8478;letter-spacing:.12em;margin:0 auto 16px;max-width:1240px}
.status b{color:#C9A36B;font-weight:500}
.toolbar{max-width:1240px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:none;border:1px solid #5C4A2C;color:#C9A36B;border-radius:6px;font-size:11px;padding:4px 14px;cursor:pointer;letter-spacing:.1em}
.btn:hover{background:rgba(185,154,107,.12)}
.btn.primary{background:rgba(185,154,107,.18);border-color:#B99A6B;color:#E8D9B8}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:16px}
.folders{border:1px solid #1E1C19;border-radius:12px;background:#0E0D0C;padding:12px;align-self:start;position:sticky;top:12px}
.folder{font-size:12px;letter-spacing:.15em;color:#CFC9BD;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px}
.folder:hover{background:#161412}
.folder.active{background:#1C1812;color:#E8D9B8;border:1px solid #3A3326}
.folder .cnt{margin-left:auto;font-size:10px;color:#6F6A60}
.folder-sub{padding-left:26px;font-size:11px;color:#8A8478;cursor:pointer;border-radius:6px;padding-top:5px;padding-bottom:5px}
.folder-sub:hover{background:#161412}
.folder-sub.active{color:#E8D9B8;background:#1C1812}
.content{min-width:0}
.scene{display:none;border:1px solid #1E1C19;border-radius:12px;background:#0E0D0C;padding:14px 16px 16px;margin-bottom:18px}
.scene.show{display:block}
.scene.ok{border-color:#3A4A2E;box-shadow:0 0 0 1px rgba(157,184,127,.25)}
.scene-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.scene-num{font-family:Georgia,serif;font-size:13px;letter-spacing:.2em;color:#C9A36B}
.scene-name{font-size:13px;letter-spacing:.18em;color:#CFC9BD}
.scene-sub{font-size:11px;color:#6F6A60;letter-spacing:.1em}
.hint{margin-left:auto;font-size:10px;color:#55504A;letter-spacing:.1em}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cell{border:1px solid #24221E;border-radius:10px;overflow:hidden;background:#050505;display:flex;flex-direction:column}
.cell.picked{border-color:#B99A6B;box-shadow:0 0 0 1px rgba(185,154,107,.45)}
.cell img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block;cursor:pointer}
.cell video{width:100%;aspect-ratio:16/9;background:#000;display:block;cursor:pointer}
.cell .meta{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:11px;color:#8A8478}
.cell .meta .name{flex:1;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid #3A382F;color:#8A8478;white-space:nowrap}
.cell.picked .badge{background:rgba(185,154,107,.14);border-color:#B99A6B;color:#C9A36B}
.empty{color:#55504A;font-size:11px;letter-spacing:.1em;padding:20px 4px}
dialog{border:0;background:#0E0D0C;color:#E8E4DC;max-width:min(1200px,94vw);width:94vw;border-radius:12px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.78)}
.dlg-body{display:grid;grid-template-columns:1fr 320px;gap:14px;padding:14px}
.dlg-media{display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;min-height:300px;max-height:74vh;overflow:hidden}
.dlg-media img,.dlg-media video{max-width:100%;max-height:74vh;object-fit:contain}
.dlg-side{font-size:11px;color:#8A8478;overflow:auto;max-height:74vh}
.dlg-side h3{color:#C9A36B;font-size:12px;letter-spacing:.15em;margin-bottom:8px}
.dlg-side pre{white-space:pre-wrap;word-break:break-all;line-height:1.7;color:#B9B2A4}
.dlg-close{position:absolute;top:8px;right:10px;background:none;border:0;color:#6F6A60;font-size:18px;cursor:pointer}
.outline{border:1px solid #1E1C19;border-radius:12px;background:#0E0D0C;padding:16px 18px;max-width:900px;line-height:1.9;font-size:12px;color:#CFC9BD}
.outline pre{white-space:pre-wrap;word-break:break-word}
.foot{max-width:1240px;margin:22px auto 0;font-size:10px;color:#55504A;letter-spacing:.15em;line-height:2}
</style>
</head>
<body>
<div class="head">
  <span class="brand">ÉLYSÉE — 审片</span>
  <span class="sub">图片资产 · 视频资产 · 单击预览 · Ctrl+单击选标准 · 定稿 · 自动刷新</span>
</div>
<div class="status" id="status">加载中…</div>
<div class="toolbar">
  <button class="btn" id="btnRefresh">手动刷新</button>
  <button class="btn" id="btnOutline">📜 剧本大纲</button>
</div>
<div class="wrap">
  <aside class="folders" id="folders"></aside>
  <div class="content" id="content"></div>
</div>
<div class="foot">
  定稿保存在 <b>assets/picks.json</b> · 重拍生成新种子版本（约 30 秒出现）· 全部 6 镜定稿后可合成 30s 成片
</div>

<dialog id="dlg">
  <button class="dlg-close" id="dlgClose">✕</button>
  <div class="dlg-body">
    <div class="dlg-media" id="dlgMedia"></div>
    <div class="dlg-side">
      <h3 id="dlgTitle"></h3>
      <div class="dlg-actions" style="margin:10px 0"></div>
      <h3>提示词 / 旁注</h3>
      <pre id="dlgPrompt"></pre>
    </div>
  </div>
</dialog>

<script>
(function(){
'use strict';
var ORDER = ['scene-01','scene-02','scene-03','scene-04','scene-05','scene-06'];
var META = {};
var $ = function(id){return document.getElementById(id);};
var stills = {}, clips = {}, picks = {}, genList = [], seen = {}, fresh = {};
var view = 'stills';           // stills | clips | outline
var viewScene = null;          // null = 全部
var stdMark = {};              // Ctrl+单击点选的「标准」文件

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderFolders(){
  var box = $('folders');
  box.innerHTML = '';
  function folder(name, id, cnt){
    var d = document.createElement('div');
    d.className = 'folder' + (view === id ? ' active' : '');
    d.innerHTML = '<span>' + name + '</span><span class="cnt">' + cnt + '</span>';
    d.onclick = function(){ view = id; viewScene = null; renderFolders(); render(); };
    box.appendChild(d);
  }
  folder('🖼 图片资产', 'stills', countAssets(stills));
  folder('🎬 视频资产', 'clips', countAssets(clips));
  folder('📜 剧本大纲', 'outline', '');
  ORDER.forEach(function(sc){
    var list = (view === 'stills' ? stills : clips)[sc] || [];
    var d = document.createElement('div');
    d.className = 'folder-sub' + (viewScene === sc ? ' active' : '');
    d.innerHTML = (META[sc] ? META[sc].name.split(' ')[0] : sc) + ' <span class="cnt" style="margin-left:6px">' + list.length + ' 版</span>';
    d.onclick = function(){ viewScene = (viewScene === sc ? null : sc); renderFolders(); render(); };
    box.appendChild(d);
  });
}
function countAssets(map){
  var n = 0;
  ORDER.forEach(function(sc){ n += (map[sc]||[]).length; });
  return n;
}

function render(){
  var box = $('content');
  if (view === 'outline') {
    fetch('/api/outline').then(function(r){return r.text();}).then(function(t){
      box.innerHTML = '<div class="outline"><pre>' + esc(t) + '</pre></div>';
    }).catch(function(){ box.innerHTML = '<div class="empty">无法读取剧本大纲</div>'; });
    return;
  }
  box.innerHTML = '';
  var map = view === 'stills' ? stills : clips;
  var n = ORDER.filter(function(s){return picks[s];}).length;
  var remain = ORDER.filter(function(s){return !picks[s];}).map(function(s){return (META[s]||{name:s}).name.split(' ')[0];});
  $('status').innerHTML = n === ORDER.length
    ? '<b>✓ 全部 6 镜已定稿</b> · 可以合成最终 30s 成片了'
    : '已选 <b>' + n + '/6</b> 镜 · ' + (remain.length ? remain.join('、') + ' 待选' : '');
  ORDER.forEach(function(sc){
    if (viewScene && viewScene !== sc) return;
    var list = map[sc] || [];
    var meta = META[sc] || {name:sc, sub:''};
    var picked = picks[sc];
    var pickedName = picked ? picked.file : null;
    var sec = document.createElement('section');
    sec.className = 'scene show' + (picked ? ' ok' : '');
    var generating = genList.indexOf(sc) >= 0;
    var head = document.createElement('div');
    head.className = 'scene-head';
    head.innerHTML = '<span class="scene-num">' + esc(meta.name) + '</span>' +
      '<span class="scene-sub">' + esc(meta.sub) + '</span>' +
      '<span class="hint">' + list.length + ' 版' + (stdMark[sc] ? ' · 标准:' + esc(stdMark[sc]) : '') + '</span>';
    var regenBtn = document.createElement('button');
    regenBtn.className = 'btn';
    if (generating) { regenBtn.textContent = '⏳ 重拍中…'; regenBtn.disabled = true; }
    else {
      regenBtn.textContent = '重拍';
      regenBtn.title = '用该镜提示词重新生成 1 个新种子版本';
      regenBtn.onclick = function(){
        fetch('/api/regen', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({scene:sc})})
          .then(function(r){return r.json();})
          .then(function(d){
            if (d.ok){ genList.push(sc); renderFolders(); render(); $('status').textContent = '已提交 ' + META[sc].name + ' 重拍，约 30 秒后新版本自动出现'; }
            else { $('status').textContent = '重拍失败: ' + (d.error || '未知错误'); }
          }).catch(function(err){ $('status').textContent = '重拍失败: ' + err; });
      };
    }
    head.appendChild(regenBtn);
    sec.appendChild(head);
    var row = document.createElement('div');
    row.className = 'row';
    if (!list.length) {
      row.innerHTML = '<div class="empty">' + (view === 'stills' ? '该镜关键帧尚未生成' : '该镜视频片段尚未生成（H3 分段运行中会自动出现）') + '</div>';
    }
    list.forEach(function(c){
      var cell = document.createElement('div');
      cell.className = 'cell' + (pickedName === c.name ? ' picked' : '');
      var media;
      if (view === 'stills') {
        media = document.createElement('img');
        media.src = c.url; media.loading = 'lazy';
      } else {
        media = document.createElement('video');
        media.src = c.url; media.preload = 'metadata'; media.muted = true; media.playsInline = true; media.controls = true;
      }
      media.title = '单击预览';
      media.onclick = function(ev){
        if (ev.ctrlKey) {
          stdMark[sc] = (stdMark[sc] === c.name ? null : c.name);
          render();
        } else {
          openPreview(sc, c, view);
        }
      };
      var metaDiv = document.createElement('div');
      metaDiv.className = 'meta';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = c.name;
      var badge = document.createElement('span');
      badge.className = 'badge';
      var isFresh = fresh[sc] && fresh[sc][c.name];
      badge.textContent = pickedName === c.name ? '✓ 已选' : (isFresh ? '新' : (stdMark[sc] === c.name ? '标准' : ('第 ' + c.variant + ' 版')));
      var btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = pickedName === c.name ? '撤销定稿' : '定稿';
      btn.onclick = function(e){
        e.stopPropagation();
        var next = (pickedName === c.name) ? null : c.name;
        fetch('/api/pick', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({scene:sc, file:next, kind:view})})
          .then(function(r){return r.json();})
          .then(function(d){
            if (d.ok){ picks = d.picks; render(); }
            else { $('status').textContent = '保存失败: ' + (d.error || '未知错误'); }
          }).catch(function(err){ $('status').textContent = '保存失败: ' + err; });
      };
      metaDiv.appendChild(nameSpan);
      metaDiv.appendChild(badge);
      metaDiv.appendChild(btn);
      cell.appendChild(media);
      cell.appendChild(metaDiv);
      row.appendChild(cell);
    });
    sec.appendChild(row);
    box.appendChild(sec);
  });
}

function openPreview(sc, c, kind){
  $('dlgTitle').textContent = (META[sc]||{name:sc}).name + ' · ' + c.name;
  var media = $('dlgMedia');
  media.innerHTML = '';
  if (kind === 'stills') {
    var img = document.createElement('img');
    img.src = c.url;
    media.appendChild(img);
  } else {
    var v = document.createElement('video');
    v.src = c.url; v.controls = true; v.autoplay = true;
    media.appendChild(v);
  }
  var acts = $('dlg').querySelector('.dlg-actions');
  acts.innerHTML = '';
  var btn = document.createElement('button');
  btn.className = 'btn primary';
  var isPicked = picks[sc] && picks[sc].file === c.name;
  btn.textContent = isPicked ? '撤销定稿' : '定稿这一版';
  btn.onclick = function(){
    fetch('/api/pick', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({scene:sc, file:isPicked ? null : c.name, kind:kind})})
      .then(function(r){return r.json();})
      .then(function(d){ if (d.ok){ picks = d.picks; $('dlg').close(); render(); } });
  };
  acts.appendChild(btn);
  fetch('/api/prompt?scene=' + encodeURIComponent(sc) + '&file=' + encodeURIComponent(c.name), {cache:'no-store'})
    .then(function(r){return r.text();})
    .then(function(t){ $('dlgPrompt').textContent = t || '(无旁注)'; });
  $('dlg').showModal();
}

function trackSeen(){
  ORDER.forEach(function(sc){
    var both = (stills[sc]||[]).concat(clips[sc]||[]);
    both.forEach(function(c){
      if (!(seen[sc]||{})[c.name]) { fresh[sc] = fresh[sc] || {}; fresh[sc][c.name] = true; }
    });
    seen[sc] = seen[sc] || {};
    both.forEach(function(c){ seen[sc][c.name] = true; });
  });
}
function poll(){
  fetch('/api/assets', {cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    var generating = d.generating || [];
    META = d.meta || META;
    var changed = JSON.stringify(d.stills) !== JSON.stringify(stills) || JSON.stringify(d.clips) !== JSON.stringify(clips);
    stills = d.stills; clips = d.clips;
    trackSeen();
    if (JSON.stringify(generating) !== JSON.stringify(genList)) { genList = generating; changed = true; }
    if (changed) { renderFolders(); render(); }
  }).catch(function(){});
}
Promise.all([
  fetch('/api/assets', {cache:'no-store'}).then(function(r){return r.json();}),
  fetch('/api/picks', {cache:'no-store'}).then(function(r){return r.json();})
]).then(function(res){
  stills = res[0].stills; clips = res[0].clips; META = res[0].meta || {};
  genList = res[0].generating || [];
  picks = res[1] || {};
  trackSeen();
  renderFolders();
  render();
}).catch(function(err){
  $('status').textContent = '加载失败: ' + err + '（请确认审片服务器已启动 http://127.0.0.1:3099）';
});
setInterval(poll, 5000);
$('btnRefresh').addEventListener('click', function(){ poll(); });
$('btnOutline').addEventListener('click', function(){ view = 'outline'; renderFolders(); render(); });
$('dlgClose').addEventListener('click', function(){ $('dlg').close(); });
$('dlg').addEventListener('click', function(e){ if (e.target === $('dlg')) $('dlg').close(); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
